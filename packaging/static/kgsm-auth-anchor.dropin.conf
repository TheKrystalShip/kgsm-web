# kgsm-web-static — the static panel's origin as a client of this machine's auth anchor.
#
# A panel on a static site has no member behind it to announce it, so it is declared to the anchor here.
# kgsm-web-static.service writes the file from the name in /etc/kgsm-web/panel.env and restarts the
# anchor when it changes; while the name is blank the file declares nothing.
[Service]
EnvironmentFile=-/var/lib/kgsm-web-static/anchor.env
