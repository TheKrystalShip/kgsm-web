# kgsm-web-static — the Control Panel served as a static site, and the plain-HTTP surface its certificate
# is issued through.
#
# kgsm-web-static.service renders both into /var/lib/kgsm-web-static from the name in
# /etc/kgsm-web/panel.env: the vhost only once the name's certificate exists, and neither while the name
# is blank. Matching nothing is not an error, so nginx loads cleanly before anything is rendered.
include /var/lib/kgsm-web-static/*.conf;
