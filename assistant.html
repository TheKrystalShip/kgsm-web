<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme: set <html data-theme> BEFORE the stylesheet applies, so a non-dark
         preference never flashes dark on load. Mirrors src/lib/theme.js and the
         same block in index.html — keep all three in sync. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("krystal:theme");
          var concrete = ["dark", "amoled", "light", "nord", "catppuccin-mocha", "dracula", "tokyo-night", "synthwave", "gruvbox", "amber-crt", "one-dark", "rose-pine", "kanagawa", "everforest", "github-light", "solarized-light", "catppuccin-latte", "nord-light", "cvd-redgreen-dark", "cvd-redgreen-light", "cvd-deuteran-dark", "cvd-deuteran-light", "cvd-protan-dark", "cvd-protan-light", "cvd-tritan-dark", "cvd-tritan-light", "cvd-universal-dark", "cvd-universal-light", "cvd-mono-dark", "cvd-mono-light"];
          var t = concrete.includes(p) ? p
                : (p === "auto" && window.matchMedia
                    && matchMedia("(prefers-color-scheme: light)").matches) ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0B0F14" />
    <!-- The tab icon is the mark as vector, so it is crisp at every OS scale; the 32px PNG is the
         fallback for browsers that take no SVG favicon. -->
    <link rel="icon" type="image/svg+xml" href="/icons/assistant-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/assistant-icon-32.png" />

    <!-- PWA: web app manifest drives Android Chrome's "Install app". This surface installs as its
         OWN app alongside the Control Panel, so every artefact here is the assistant's — a
         manifest, a service worker and icons of its own, laid over the shared public/ directory
         from public-assistant/ (see vite.assistant.config.js). -->
    <link rel="manifest" href="/assistant.webmanifest" />

    <!-- iOS Safari ignores the web manifest; these tags are the Safari-specific install hints for
         home-screen icons, title, and standalone behaviour. Sizes follow Apple's icon-selection
         rules: the system picks the entry whose size best matches the target surface; the un-sized
         fallback is used when no sized variant wins. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/assistant-apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/assistant-apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/assistant-apple-touch-icon-152.png" />
    <link rel="apple-touch-icon"                 href="/icons/assistant-apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black: status bar is black and the viewport does not extend underneath it;
         env(safe-area-inset-top) in the CSS clears the content. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Assistant" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Prevent iOS from auto-linking phone numbers, dates, and addresses in rendered text, which
         would create unexpected tap targets in the UI. -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <!-- Launch/splash screens shown during cold-start before the JS bundle evaluates. iOS picks the
         entry whose media query matches the device; each image is a solid #0B0F14 background with
         the app icon centred. Portrait only — iOS uses portrait splash even on landscape launches.
         Sizes = logical_width×logical_height × device_pixel_ratio, and each one has a matching
         entry in scripts/make-assistant-icons.mjs, which draws them. -->
    <!-- iPhone SE (1st gen / 5 / 5s) — 320×568 @2x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-640x1136.png"
          media="(device-width:320px) and (device-height:568px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <!-- iPhone 6/7/8, SE 2nd/3rd gen — 375×667 @2x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-750x1334.png"
          media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <!-- iPhone XR, 11 — 414×896 @2x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-828x1792.png"
          media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <!-- iPhone X, XS, 11 Pro, 12 mini, 13 mini — 375×812 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1125x2436.png"
          media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone XS Max, 11 Pro Max — 414×896 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1242x2688.png"
          media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone 12, 12 Pro, 13, 13 Pro, 14 — 390×844 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1170x2532.png"
          media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone 12 Pro Max, 13 Pro Max, 14 Plus — 428×926 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1284x2778.png"
          media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone 14 Pro, 15, 15 Pro, 16 — 393×852 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1179x2556.png"
          media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone 14 Pro Max, 15 Plus, 15 Pro Max, 16 Plus — 430×932 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1290x2796.png"
          media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPhone 16 Pro Max — 440×956 @3x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1320x2868.png"
          media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <!-- iPad (all sizes that share 768×1024 @2x) -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1536x2048.png"
          media="(device-width:768px) and (device-height:1024px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <!-- iPad Pro 11-inch — 834×1194 @2x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-1668x2388.png"
          media="(device-width:834px) and (device-height:1194px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <!-- iPad Pro 12.9-inch — 1024×1366 @2x -->
    <link rel="apple-touch-startup-image" href="/splash/assistant-splash-2048x2732.png"
          media="(device-width:1024px) and (device-height:1366px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />

    <title>Krystal Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/assistant/main.jsx"></script>
  </body>
</html>
